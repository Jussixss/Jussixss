name: Refresh profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # 06:17 Moscow time (UTC+3)
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-assets.yml'
      - '.github/profile-3d.json'
      - 'scripts/generate-stats.py'

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Jussixss/Jussixss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Render GitHub statistics
        run: python3 scripts/generate-stats.py
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: Jussixss
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Jussixss
          outputs: |
            assets/generated/snake.svg?palette=github-dark&color_snake=#43f4f4&color_dots=#211831,#513077,#8050b7,#b879f2,#ff4fbd
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: Jussixss
          SETTING_JSON: .github/profile-3d.json
      - name: Collect and validate SVG assets
        run: |
          cp profile-3d-contrib/profile-cyberpunk.svg assets/generated/activity-3d.svg
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for name in ('stats.svg', 'snake.svg', 'activity-3d.svg'):
              path = Path('assets/generated') / name
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              assert path.stat().st_size > 100, path
              print(f'Validated {path}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-svg
          path: assets/generated/*.svg
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-svg
          path: assets/generated
      - name: Publish generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/generated/stats.svg assets/generated/snake.svg assets/generated/activity-3d.svg
          if git diff --cached --quiet; then
            echo 'Profile assets are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh profile activity assets'
          git pull --rebase origin main
          git push origin HEAD:main
